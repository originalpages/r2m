<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>r2m</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>r2m</h1>
      <p class="sub">See how a public GitHub project is built: paste its address and get a picture. Nothing is installed or uploaded; it runs in your browser.</p>
      <form id="form">
        <label class="wide">Repository
          <input id="repo" required placeholder="owner/repo or https://github.com/owner/repo" autocomplete="off" />
        </label>
        <label>Branch (optional)
          <input id="branch" placeholder="default branch" autocomplete="off" />
        </label>
        <label>What to show
          <select id="type">
            <option value="arch">Overview (main parts and how they connect)</option>
            <option value="deps">Which files use which</option>
            <option value="tree">Folder structure</option>
          </select>
        </label>
        <label>Folder depth (optional)
          <input id="depth" type="number" min="1" placeholder="automatic" />
        </label>
        <label>Max boxes (optional)
          <input id="maxNodes" type="number" min="1" placeholder="automatic" />
        </label>
        <button id="go" type="submit">Generate</button>
      </form>
      <p id="status" role="status"></p>
      <section id="result" hidden>
        <div class="actions">
          <button id="dl-png" type="button">Save as picture (PNG)</button>
          <button id="dl-svg" type="button">Save as SVG</button>
          <button id="copy" type="button">Copy Mermaid source</button>
          <button id="dl-mmd" type="button">Download .mmd</button>
        </div>
        <div id="diagram" class="diagram"></div>
        <details>
          <summary>Mermaid source</summary>
          <pre id="source"></pre>
        </details>
      </section>
      <footer class="footer">
        Generated by <a href="https://github.com/originalpages/r2m">r2m</a> &middot;
        <a href="https://github.com/originalpages/r2m">https://github.com/originalpages/r2m</a>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
