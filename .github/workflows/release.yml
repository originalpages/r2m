name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']   # not the moving v0 tag used by the Action
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - name: Build binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="r2m"; [ "$os" = windows ] && name="r2m.exe"
            out="r2m_${version}_${os}_${arch}"
            mkdir -p "dist/$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/originalpages/r2m/internal/cli.Version=${version}" \
              -o "dist/$out/$name" ./cmd/r2m
            cp LICENSE README.md "dist/$out/"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$out.zip" "$out"); else tar -C dist -czf "dist/$out.tar.gz" "$out"; fi
            rm -rf "dist/$out"
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
